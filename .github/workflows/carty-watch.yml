name: Carty Radar

on:
  # ── Moteur principal ────────────────────────────────────────────────────
  # cron-job.org envoie un repository_dispatch toutes les 2 minutes.
  # Contrairement à `schedule`, ce déclencheur n'est PAS étranglé par GitHub :
  # il part d'un POST externe et s'exécute immédiatement.
  repository_dispatch:
    types: [carty-tick]

  # ── Filet de sécurité ───────────────────────────────────────────────────
  # Le cron GitHub natif. Mesuré du 23 au 31/08/2026 : 2 à 29 runs/jour au lieu
  # de 96, avec des trous de 2 à 6 h. On le garde uniquement pour le cas où
  # cron-job.org tomberait, pas comme moteur principal.
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "normal | seed | test | dry-run"
        required: false
        default: "normal"

concurrency:
  group: carty-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAO_COOKIE: ${{ secrets.SAO_COOKIE }}
          WATCH_USERNAMES: ${{ vars.WATCH_USERNAMES || 'derekcarty' }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            seed)     python carty_watch.py --seed ;;
            test)     python carty_watch.py --test ;;
            dry-run)  python carty_watch.py --dry-run ;;
            *)        python carty_watch.py ;;
          esac

      - name: Persist state
        run: |
          git config user.name  "carty-radar[bot]"
          git config user.email "carty-radar@users.noreply.github.com"
          git add state/seen.json data/picks_log.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement d'état."
          else
            git commit -m "state: nouveaux picks détectés [skip ci]"
            # Le cron peut se chevaucher avec un push manuel : on rejoue par-dessus.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

