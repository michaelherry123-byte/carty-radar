name: Carty Radar

on:
  schedule:
    # Toutes les 5 minutes. GitHub applique souvent un retard de 3 à 10 min
    # sur les crons du plan gratuit : latence réelle attendue 5-15 min.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | seed | test | dry-run"
        required: false
        default: "normal"

concurrency:
  group: carty-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAO_COOKIE: ${{ secrets.SAO_COOKIE }}
          WATCH_USERNAMES: ${{ vars.WATCH_USERNAMES || 'derekcarty' }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            seed)     python carty_watch.py --seed ;;
            test)     python carty_watch.py --test ;;
            dry-run)  python carty_watch.py --dry-run ;;
            *)        python carty_watch.py ;;
          esac

      - name: Persist state
        run: |
          git config user.name  "carty-radar[bot]"
          git config user.email "carty-radar@users.noreply.github.com"
          git add state/seen.json data/picks_log.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement d'état."
          else
            git commit -m "state: nouveaux picks détectés [skip ci]"
            # Le cron peut se chevaucher avec un push manuel : on rejoue par-dessus.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

# indexation Actions
